version: 1
pipeline:
  type: serial
paths:
  workspace: /workspace/bugfix
  goal: /workspace/bugfix/goal.md
artifacts:
  requirements:
    path: /workspace/bugfix/bug-analysis.json
  implementation:
    path: /workspace/bugfix/bugfix.patch
  validationReport:
    path: /workspace/bugfix/bugfix-validation.json
defaults:
  executor: claude
  cwd: ${paths.workspace}
  goalPath: ${paths.goal}
stages:
  - id: analysis
    type: requirements-analysis
    produces: requirements
  - id: fix
    type: development
    consumes: requirements
    produces: implementation
  - id: regression
    type: testing
    consumes:
      - requirements
      - implementation
    produces: validationReport
